<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>优化器逐步讲解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16202b; --muted: #5d6b7a; --line: #c9d1da;
    --accent: #0b6e8a; --warm: #a8650c; --proc: #e3f1f5; --good: #2f8a4f; --bad: #b42318; --purple: #7b4fb3;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b; --panel: #161e26; --ink: #e6edf3; --muted: #93a1b0; --line: #2c3844;
      --accent: #4cc0df; --warm: #f0b44c; --proc: #16303a; --good: #62d48a; --bad: #ff7b72; --purple: #b99bf0; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .wrap { padding: 24px 16px 40px; }
  .view { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .view[hidden] { display: none; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
  .gist { margin: -6px 0 0; font-size: 16px; line-height: 1.7; max-width: 48em; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  svg.diagram { display: block; width: 100%; height: auto; font-family: var(--font-body); }
  .colhead { fill: var(--muted); font-size: 13px; font-weight: 500; }

  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
  .title { fill: var(--ink); font-family: var(--font-code); font-size: 13.5px; font-weight: 600; }
  .titlecn { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .sub { fill: var(--muted); font-size: 12.5px; }
  .node { opacity: 0.25; transition: opacity .45s; }
  .node.on, .node.sel { opacity: 1; }
  .node.hot .box { stroke: var(--accent); stroke-width: 3; }
  .node.sel .box { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 7 4; }
  .node.proc .box { fill: var(--proc); }
  .clickable { cursor: pointer; outline: none; }
  .clickable:hover .box { stroke: var(--ink); }
  .clickable:focus-visible .box { stroke: var(--ink); stroke-width: 3; }

  .info circle { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
  .info text { fill: var(--muted); font-family: var(--font-code); font-size: 12px; font-weight: 600; }
  .clickable:hover .info circle, .sel .info circle { fill: var(--ink); stroke: var(--ink); }
  .clickable:hover .info text, .sel .info text { fill: var(--panel); }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .link { fill: none; stroke: var(--accent); stroke-width: 2.2; animation: fadein .45s; }
  .link.warm { stroke: var(--warm); }
  .linklabel { fill: var(--accent); font-family: var(--font-code); font-size: 12px; font-weight: 600; animation: fadein .45s; }
  .linklabel.warm { fill: var(--warm); }

  .gtitle { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .glabel { fill: var(--muted); font-size: 12.5px; font-family: var(--font-code); }
  .cell rect { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .cell text { font-family: var(--font-code); font-size: 12px; fill: var(--ink); }
  .cell.hi rect.bg { fill: color-mix(in srgb, var(--warm) 22%, var(--panel)); stroke: var(--warm); }
  .cell.blank rect.bg { fill: var(--panel); stroke-dasharray: 3 3; }
  .formula { fill: var(--muted); font-size: 12.5px; font-family: var(--font-code); }
  .gridg { animation: fadein .45s; }
  .gridg.clickable:hover .gframe { stroke: var(--ink); }
  .gframe { fill: none; stroke: transparent; stroke-width: 2; }
  .gridg.sel .gframe { stroke: var(--ink); stroke-dasharray: 7 4; }
  .track { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
  .fill { fill: var(--accent); animation: fadein .45s; }
  .fill.warm { fill: var(--warm); }
  .target { stroke: var(--good); stroke-width: 2.5; }
  .tlabel { fill: var(--good); font-size: 12.5px; font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; color: var(--muted); font-size: 13.5px; margin-top: -6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  .sw.hot { border: 3px solid var(--accent); background: var(--panel); }
  .sw.proc { background: var(--proc); border-color: var(--line); }
  .sw.hi { background: color-mix(in srgb, var(--warm) 22%, var(--panel)); border-color: var(--warm); }
  .sw.sgd { background: var(--warm); border-color: var(--warm); }
  .sw.adam { background: var(--accent); border-color: var(--accent); }
  .legend .icon { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-grid; place-items: center; font-family: var(--font-code); font-size: 11px; font-weight: 600; }

  .note { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--ink); border-radius: 14px; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
  .note[hidden] { display: none; }
  .note-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .note-title { margin: 0; font-family: var(--font-code); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .note-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
  .note-close:hover { border-color: var(--ink); }
  .note dl { margin: 0; display: grid; grid-template-columns: 8.5em 1fr; gap: 10px 16px; }
  .note dt { color: var(--muted); font-size: 14px; padding-top: 1px; }
  .note dd { margin: 0; font-size: 15px; line-height: 1.7; min-width: 0; }
  .note dd p { margin: 0; }
  .sample { margin: 0; font-family: var(--font-code); font-size: 12.5px; line-height: 1.55; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .caption { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-height: 140px; display: flex; flex-direction: column; gap: 12px; }
  .caption .say { margin: 0; font-size: 19px; line-height: 1.65; font-weight: 500; max-width: 42em; text-wrap: pretty; }
  .caption .code { margin: 0; font-family: var(--font-code); font-size: 13px; line-height: 1.6; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }

  .nav { display: flex; align-items: center; gap: 14px; }
  .nav button.arrow-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
  .nav button.arrow-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav button.arrow-btn:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dots { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; justify-content: center; }
  .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; }
  .dots button.done { background: var(--line); }
  .dots button.now { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 3.5em; text-align: right; flex: none; }

  @media (min-width: 700px) {
    .nav button.arrow-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
    .nav .prev { left: 8px; }
    .nav .next { right: 8px; }
    .view { padding-inline: 64px; }
  }
  @media (min-width: 1200px) {
    .view { padding-inline: 0; }
    .nav .prev { left: calc(50% - 592px); }
    .nav .next { right: calc(50% - 592px); }
  }
  @media (max-width: 640px) { .note dl { grid-template-columns: 1fr; gap: 2px 0; } .note dd { margin-bottom: 8px; } }
  @media (prefers-reduced-motion: reduce) { .node, .link, .linklabel, .gridg, .fill { transition: none; animation: none; } }

  .tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 14px 16px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab { font-family: var(--font-body); font-size: 14px; padding: 7px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .tab:hover { border-color: var(--accent); }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { color: #0f151b; } }
</style>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="切换页面">
  <button class="tab" role="tab" id="tab-overview" aria-selected="true">整体：一步训练里的优化器</button>
  <button class="tab" role="tab" id="tab-sgd" aria-selected="false">SGD：最简单的优化器</button>
  <button class="tab" role="tab" id="tab-adamw" aria-selected="false">AdamW 怎么算</button>
  <button class="tab" role="tab" id="tab-batch" aria-selected="false">本项目：32 个回答、16 次累积、学习率</button>
</nav>
<div class="wrap" id="wrap"></div>

<template id="view-tpl">
<div class="view">
  <h1 data-r="h1"></h1>
  <p class="gist" data-r="gist"></p>
  <div class="legend" data-r="legend" aria-label="图例"></div>
  <div class="stage">
    <svg class="diagram" data-r="diagram" role="group">
      <defs>
        <marker data-r="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"></path></marker>
        <marker data-r="headw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"></path></marker>
      </defs>
      <g data-r="draw"></g>
    </svg>
  </div>
  <section class="note" data-r="note" hidden aria-live="polite">
    <div class="note-head">
      <h2 class="note-title" data-r="noteTitle"></h2>
      <button class="note-close" data-r="noteClose" aria-label="隐藏说明"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"></path></svg></button>
    </div>
    <dl data-r="noteRows"></dl>
  </section>
  <div class="caption" aria-live="polite">
    <p class="say" data-r="say"></p>
    <p class="code" data-r="code"></p>
  </div>
  <div class="nav">
    <button class="arrow-btn prev" data-r="prev" aria-label="上一步"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"></path></svg></button>
    <div class="dots" data-r="dots"></div>
    <span class="count" data-r="count"></span>
    <button class="arrow-btn next" data-r="next" aria-label="下一步"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4 6 6-6 6"></path></svg></button>
  </div>
</div>
</template>

<script>
var SVGNS = "http://www.w3.org/2000/svg";
function fmt(v) { return typeof v === "string" ? v : String(v); }

/* 一个页面：顶部 h1 和一句话，中间 SVG，点框看说明，下面是这一步的说明和代码，最下面翻页 */
function makeView(cfg) {
  var view = document.getElementById("view-tpl").content.firstElementChild.cloneNode(true);
  view.id = cfg.key + "-view";
  document.getElementById("wrap").appendChild(view);
  var $ = function (r) { return view.querySelector('[data-r="' + r + '"]'); };
  $("h1").textContent = cfg.h1;
  $("gist").textContent = cfg.gist;
  $("diagram").setAttribute("viewBox", cfg.viewBox);
  $("diagram").setAttribute("aria-label", cfg.h1);
  $("head").id = cfg.key + "-head";
  $("headw").id = cfg.key + "-headw";
  var selected = null, cur = 0;

  function mk(tag, attrs, parent, text) {
    var el = document.createElementNS(SVGNS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    if (parent) parent.appendChild(el);
    return el;
  }
  function clickable(g, id) {
    g.classList.add("clickable");
    g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
    g.setAttribute("aria-label", cfg.notes[id].title + "，点击查看说明");
    g.setAttribute("data-id", id);
    if (id === selected) g.classList.add("sel");
    g.addEventListener("click", function () { choose(id); });
    g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(id); } });
  }
  function info(g, cx, cy) {
    var ic = mk("g", { "class": "info" }, g);
    mk("circle", { cx: cx, cy: cy, r: 9 }, ic);
    mk("text", { x: cx, y: cy + 4, "text-anchor": "middle" }, ic, "i");
  }
  /* 框：s.on 里有它就亮，s.hot 里有它就描蓝边 */
  function box(root, s, id, x, y, w, h, title, sub, opt) {
    opt = opt || {};
    var g = mk("g", { "class": "node" + (s.on.indexOf(id) >= 0 ? " on" : "") + (s.hot.indexOf(id) >= 0 ? " hot" : "") + (opt.proc ? " proc" : "") }, root);
    mk("rect", { "class": "box", x: x, y: y, width: w, height: h, rx: 10 }, g);
    mk("text", { "class": "titlecn", x: x + 14, y: sub ? y + 24 : y + h / 2 + 5 }, g, title);
    if (sub) mk("text", { "class": "sub", x: x + 14, y: y + 44 }, g, sub);
    info(g, x + w - 18, sub ? y + 20 : y + h / 2);
    clickable(g, id);
    return g;
  }
  /* 一行格子：label 是行名，vals 里 "" 是空格子；o.hi 整行标黄；o.id 点开的说明 */
  function row(root, x, y, cw, label, vals, o) {
    o = o || {};
    var g = mk("g", { "class": "gridg" }, root);
    if (label) mk("text", { "class": "glabel", x: x - 8, y: y + 19, "text-anchor": "end" }, g, label);
    vals.forEach(function (v, j) {
      var hi = o.hi || (o.hiCols && o.hiCols.indexOf(j) >= 0);
      var cg = mk("g", { "class": "cell" + (hi && v !== "" ? " hi" : "") + (v === "" ? " blank" : "") }, g);
      mk("rect", { "class": "bg", x: x + j * cw, y: y, width: cw, height: 28 }, cg);
      mk("text", { x: x + j * cw + cw / 2, y: y + 18.5, "text-anchor": "middle" }, cg, fmt(v));
    });
    if (o.id) {
      var lw = label ? label.replace(/[^\x00-\xff]/g, "xx").length * 7 + 14 : 6;
      var fr = mk("rect", { "class": "gframe", x: x - lw, y: y - 4, width: vals.length * cw + lw + 26, height: 36, rx: 8 }, g);
      g.insertBefore(fr, g.firstChild);
      info(g, x + vals.length * cw + 12, y + 14);
      clickable(g, o.id);
    }
    return g;
  }
  function arrow(root, d, warm) { return mk("path", { "class": "link" + (warm ? " warm" : ""), d: d, "marker-end": "url(#" + cfg.key + (warm ? "-headw" : "-head") + ")" }, root); }
  function label(root, x, y, text, warm, anchor) { return mk("text", { "class": "linklabel" + (warm ? " warm" : ""), x: x, y: y, "text-anchor": anchor || "start" }, root, text); }
  /* 一条进度条：参数从 1 走向 3，fill 画到当前值 */
  function bar(root, x, y, w, name, val, warm) {
    var X = function (v) { return x + (v - 1) / 2 * w; };
    mk("text", { "class": "glabel", x: x - 8, y: y + 14, "text-anchor": "end" }, root, name);
    mk("rect", { "class": "track", x: x, y: y, width: w, height: 20, rx: 4 }, root);
    mk("rect", { "class": "fill" + (warm ? " warm" : ""), x: x, y: y, width: Math.max(2, X(val) - x), height: 20, rx: 4 }, root);
    mk("text", { "class": "glabel", x: Math.max(X(val), x + 2) + 8, y: y + 14 }, root, val.toFixed(4));
    mk("line", { "class": "target", x1: X(3), y1: y - 4, x2: X(3), y2: y + 24 }, root);
  }
  var api = { mk: mk, box: box, row: row, arrow: arrow, label: label, bar: bar };

  function renderNote(id) {
    var n = cfg.notes[id];
    $("noteTitle").textContent = n.title;
    var dl = $("noteRows"); dl.textContent = "";
    n.rows.forEach(function (r) {
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd"); var v = r[1];
      if (typeof v === "string") { var p = document.createElement("p"); p.textContent = v; dd.appendChild(p); }
      else { var pre = document.createElement("pre"); pre.className = "sample"; pre.textContent = v.pre; dd.appendChild(pre); }
      dl.appendChild(dt); dl.appendChild(dd);
    });
  }
  function choose(id) {
    selected = (selected === id) ? null : id;
    view.querySelectorAll("[data-id]").forEach(function (g) { g.classList.toggle("sel", g.getAttribute("data-id") === selected); });
    if (selected) { renderNote(selected); $("note").hidden = false; } else { $("note").hidden = true; }
  }
  $("noteClose").addEventListener("click", function () { if (selected) choose(selected); });

  function show(i) {
    cur = Math.max(0, Math.min(cfg.steps.length - 1, i));
    var s = cfg.steps[cur];
    s.on = s.on || []; s.hot = s.hot || [];
    var root = $("draw"); root.textContent = "";
    cfg.draw(api, root, s);
    if (selected && !view.querySelector('[data-id="' + selected + '"]')) choose(selected);
    $("say").textContent = s.say;
    $("code").textContent = s.code;
    $("count").textContent = (cur + 1) + " / " + cfg.steps.length;
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === cfg.steps.length - 1;
    var dots = $("dots").children;
    for (var k = 0; k < dots.length; k++) { dots[k].classList.toggle("now", k === cur); dots[k].classList.toggle("done", k < cur); }
    if (window.__setHash) window.__setHash(cfg.key, cur + 1);
  }
  cfg.steps.forEach(function (_, i) {
    var b = document.createElement("button");
    b.setAttribute("aria-label", "第 " + (i + 1) + " 步");
    b.addEventListener("click", function () { show(i); });
    $("dots").appendChild(b);
  });
  $("prev").addEventListener("click", function () { show(cur - 1); });
  $("next").addEventListener("click", function () { show(cur + 1); });
  document.addEventListener("keydown", function (e) {
    if (view.hidden) return;
    if (e.key === "ArrowRight") show(cur + 1);
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "Escape" && selected) choose(selected);
  });
  cfg.legend.forEach(function (it) {
    var sp = document.createElement("span");
    var sw = document.createElement("i");
    if (it[0] === "info") { sw.className = "icon"; sw.textContent = "i"; } else sw.className = "sw " + it[0];
    sp.appendChild(sw); sp.appendChild(document.createTextNode(it[1])); $("legend").appendChild(sp);
  });
  view.hidden = true;
  show(0);
  window.__v = window.__v || {};
  window.__v[cfg.key] = { show: show, cur: function () { return cur; } };
}
function n(title, rows) { return { title: title, rows: rows }; }
</script>

<script>
/* ===== 第 1 页：一步训练里优化器做什么 ===== */
(function () {
  var BX = 60, BW = 330, VX = 500, CW = 120, NX = 778;
  var Y = { loss: 20, par: 110, grad: 190, opt: 270, state: 350, sch: 490 };

  function draw(A, root, s) {
    var st = s.stage;
    var S = { on: ["loss", "par", "grad", "opt", "state", "sch"], hot: s.hot || [] };
    A.box(root, S, "loss", BX, Y.loss, BW, 60, "损失 loss", "0.2 × (w1 − 3)² + 0.002 × (w2 − 3)²");
    A.box(root, S, "par", BX, Y.par, BW, 60, "参数 w1、w2", "模型里要训练的数");
    A.box(root, S, "grad", BX, Y.grad, BW, 60, "梯度 p.grad", "挂在每个参数上；每步写入、每步清空");
    A.box(root, S, "opt", BX, Y.opt, BW, 60, "优化器 AdamW", "optimizer.step() 读梯度，改参数", { proc: true });
    A.box(root, S, "state", BX, Y.state, BW, 120, "优化器状态 state", "每个参数一份；留到下一步", {});
    A.box(root, S, "sch", BX, Y.sch, BW, 60, "学习率调度器 lr_scheduler", "每步改一次学习率 lr");

    var h = s.hi || [];

    if (s.acc) A.mk("rect", { "class": "fill", x: 375, y: 254, width: 250 * s.acc / 16, height: 18, rx: 4 }, root);
    A.mk("text", { "class": "glabel", x: 375, y: 290 }, root, s.acc ? "p.grad 已加 " + s.acc + " / 16 份" : "p.grad 是空的");
    A.row(root, 690, 254, 230, "", ["lr = " + lrText(lrAt(s.lr))], { hi: s.lrHi, id: "lr" });
    var a = s.arrows || [];
    if (a.indexOf("gen") >= 0) A.arrow(root, "M" + (X0 - 30) + " 50 V136 H" + (X0 - 6));
    if (a.indexOf("toModel") >= 0) {
      var k0 = (s.cur || [0])[0];
      var cx = X0 + k0 * 2 * CW + CW;
      A.arrow(root, "M" + cx + " 154 V166 H" + (X0 + 125) + " V180");
    }
    if (a.indexOf("toGrad") >= 0) A.arrow(root, "M" + (X0 + 252) + " 214 H371");
    if (a.indexOf("toOpt") >= 0) A.arrow(root, "M627 214 H676", true);
    // 学习率曲线
    var cx0 = 110, cx1 = 900, cy0 = 372, cy1 = 530;
    var px = function (n) { return cx0 + (n - 1) / 399 * (cx1 - cx0); };
    var py = function (v) { return cy1 - v / LR0 * (cy1 - cy0); };
    A.mk("text", { "class": "gtitle", x: X0, y: 330 }, root, "学习率随步数的变化：第 n 步用 5e-6 × (401 − n) ÷ 400");
    A.mk("line", { x1: cx0, y1: cy1, x2: cx1, y2: cy1, stroke: "var(--line)", "stroke-width": 1.5 }, root);
    A.mk("line", { x1: cx0, y1: cy0 - 6, x2: cx0, y2: cy1, stroke: "var(--line)", "stroke-width": 1.5 }, root);
    [[LR0, "5e-6"], [LR0 / 2, "2.5e-6"], [0, "0"]].forEach(function (t) {
      A.mk("text", { "class": "glabel", x: cx0 - 8, y: py(t[0]) + 4, "text-anchor": "end" }, root, t[1]);
    });
    [1, 100, 200, 300, 400].forEach(function (n) {
      A.mk("text", { "class": "glabel", x: px(n), y: cy1 + 18, "text-anchor": "middle" }, root, "第 " + n + " 步");
    });
    A.mk("path", { "class": "link", d: "M" + px(1) + " " + py(lrAt(1)) + " L" + px(400) + " " + py(lrAt(400)), "marker-end": "" }, root);
    (s.dots || [s.lr]).forEach(function (n) {
      A.mk("circle", { "class": "fill", cx: px(n), cy: py(lrAt(n)), r: 6 }, root);
      var right = n > 300, top = n <= 3;
      A.mk("text", { "class": "glabel", x: px(n) + (right ? -12 : 12), y: py(lrAt(n)) + (right ? -40 : -14), "text-anchor": right ? "end" : "start" }, root, "第 " + n + " 步：" + lrText(lrAt(n)));
    });
  }

  var STEPS = [
    { gen: true, lr: 2, arrows: [],
      say: "例子是 GRPO 正式运行日志里的第 2 步。这一步开始时，vLLM 一次给 4 道题各写 8 个回答，一共写出 32 个回答。同一道题的 8 个回答在 32 行里连在一起。",
      code: "generation_batch = self._generate_and_score_completions(generation_batch)   # GRPOTrainer._prepare_inputs：一次传入 32 行" },
    { split: true, arrows: ["gen"], lr: 2,
      say: "TRL 把这 32 个回答打乱顺序，再切成 16 份，每份 2 个回答。每份放几个由 per_device_train_batch_size = 2 决定，份数就是 32 ÷ 2 = 16。打乱以后，同一道题的回答分散到不同的份里。",
      code: "generation_batch = shuffle_sequence_dict(generation_batch)\nself._buffered_inputs = split_tensor_dict(generation_batch, self.args.steps_per_generation)   # 16 份" },
    { split: true, cur: [0], acc: 1, hot: ["model", "grad"], arrows: ["toModel", "toGrad"], lr: 2,
      say: "第 1 次 training_step：训练模型拿第 1 份的 2 个回答，算出这 2 个回答的平均损失，再把它除以 16。loss.backward() 把这份损失的梯度加到每个参数的 p.grad 上。这一次 Trainer 不调用 optimizer.step()，参数不变。",
      code: "loss = ((per_token_loss * mask).sum(-1) / mask.sum(-1)).mean() / 16   # GRPOTrainer._compute_loss\nloss.backward()" },
    { split: true, cur: [15], acc: 16, hot: ["model", "grad"], arrows: ["toModel", "toGrad"], lr: 2,
      say: "第 2 到第 16 次 training_step 重复同样的事：训练模型每次拿下一份的 2 个回答，算损失、除以 16、backward，新的梯度接着加在 p.grad 上。16 份的损失各除以 16 再加起来，正好等于 32 个回答的平均损失，所以加满 16 份以后，p.grad 就是 32 个回答平均损失的梯度。",
      code: "inputs = self._buffered_inputs[self._step % self.args.steps_per_generation]   # 第 2 … 16 份" },
    { split: true, acc: 16, hot: ["grad", "opt"], arrows: ["toOpt"], lr: 2, lrHi: true,
      say: "16 份加满后，Trainer 先算 p.grad 的总长度：日志记的第 2 步 grad_norm 是 1.766，超过 max_grad_norm = 1.0，Trainer 把所有梯度按同一个比例缩到总长度 1.0。然后 Trainer 调用 optimizer.step()：AdamW 先把每个参数乘以 1 − 4.9875e-6 × 0.01，再按 p.grad 把每个参数挪大约一个学习率 4.9875e-6 那么远。",
      code: "grad_norm = self._clip_grad_norm(model)   # max_grad_norm = 1.0\nself.optimizer.step()   # lr = 4.9875e-6，weight_decay = 0.01" },
    { split: true, acc: 0, hot: ["grad"], lr: 3, lrHi: true,
      say: "改完参数后，Trainer 调用 lr_scheduler.step()，把学习率从 4.9875e-6 改成第 3 步要用的 4.975e-6。Trainer 再调用 model.zero_grad()，把每个参数的 p.grad 清空。",
      code: "self.lr_scheduler.step()   # lr：4.9875e-6 → 4.975e-6\nmodel.zero_grad()" },
    { gen: true, lr: 3,
      say: "第 3 步开始时，训练不再使用第 2 步的 32 个回答（num_iterations = 1）。vLLM 拿到刚改过的参数，写出 32 个新回答，然后重复上面的过程。正式运行一共 400 步，所以 AdamW 一共改 400 次参数。",
      code: "GRPOConfig(num_iterations=1, max_steps=400)" },
    { lr: 400, dots: [1, 200, 400], lrHi: true,
      say: "学习率每步减少 5e-6 ÷ 400 = 1.25e-8：第 1 步用 5e-6，第 200 步用 2.5125e-6，第 400 步用 1.25e-8。第 400 步改完参数后，lr_scheduler.step() 把学习率改成 0，但这时训练已经结束，学习率 0 没有被任何一次更新用到。warmup 是 0 步，所以学习率从第 1 步就是 5e-6，没有先升后降。",
      code: "GRPOConfig(learning_rate=a.lr, lr_scheduler_type=\"linear\")   # --lr 默认 5e-6；warmup_steps 默认 0" }
  ];

  var NOTES = {
    gen32: n("vLLM 一次生成的 32 个回答", [
      ["是什么", "每一步训练开始时，vLLM 一次写出的全部回答。32 = 4 道题（--prompts-per-rollout 4）× 每题 8 个（num_generations = 8）。"],
      ["谁生成", "GRPOTrainer._prepare_inputs 在每步第 1 次 training_step 时调用 _generate_and_score_completions，一次生成这 32 个。"],
      ["用多久", "只用这一步；下一步 vLLM 写 32 个新回答（num_iterations = 1）。"]]),
    slots: n("16 份，每份 2 个（_buffered_inputs）", [
      ["是什么", "32 个回答打乱顺序后切成的 16 份。每份 2 个由 per_device_train_batch_size = 2 决定。"],
      ["怎么变", "每步第 1 次 training_step 时写入；第 k 次 training_step 拿第 k 份；下一步生成时整个换掉。"],
      ["例子", "图里格子打乱后的顺序是示意，日志没有记录真实的顺序。"]]),
    model: n("训练模型 self.model", [
      ["是什么", "正在训练的 Qwen2.5-1.5B。每次 training_step 给 2 个回答的每个 token 打分，算出损失。"],
      ["一次放几个", "2 个回答，为了省显存；生成时是一次 32 个。"]]),
    grad: n("梯度 p.grad", [
      ["默认值", "每步开始时是空的。"],
      ["怎么变", "每次 loss.backward() 把这份损失的梯度加上去；加满 16 份后 optimizer.step() 读它；model.zero_grad() 把它清空。"],
      ["例子", "第 2 步加满后总长度 1.766（日志 grad_norm），Trainer 把它缩到 1.0。"]]),
    opt: n("优化器 AdamW", [
      ["是什么", "optim = \"adamw_torch_fused\"，beta1 = 0.9，beta2 = 0.999，epsilon = 1e-8，weight_decay = 0.01。"],
      ["什么时候改参数", "每 16 次 training_step 调一次 optimizer.step()，一步训练改一次参数。"],
      ["怎么算", "见“AdamW 怎么算”那一页：每个参数每次挪大约一个学习率那么远。"]]),
    lr: n("学习率 lr", [
      ["默认值", "第 1 步 5e-6：--lr 的默认值，train.py 用 learning_rate = a.lr 交给 TRL。"],
      ["怎么变", "lr_scheduler_type = \"linear\"，warmup 0 步：每次 optimizer.step() 之后，lr_scheduler.step() 把学习率减 1.25e-8。第 n 步用 5e-6 × (401 − n) ÷ 400。"],
      ["日志里的值", { pre: "第 1 步    5e-06\n第 2 步    4.988e-06\n第 3 步    4.975e-06\n第 200 步  2.513e-06\n第 400 步  1.25e-08" }]])
  };

  makeView({ key: "batch", viewBox: "0 0 1000 570", steps: STEPS, notes: NOTES, draw: draw,
    h1: "本项目一步训练：32 个回答、16 次累积、1 次更新",
    gist: "本质上是，vLLM 一次写好 32 个回答，训练模型分 16 次、每次拿 2 个回答算损失，把梯度一直加在参数上，加满 16 次后 AdamW 按当前学习率把参数改一次。",
    legend: [["hot", "这一步讲到的部分"], ["proc", "正在运行的对象"], ["hi", "这一步用到的格子或数"], ["info", "点框或数看说明"]] });
})();
</script>
<script>
(function () {
  var TABS = [{ key: "overview", title: "优化器：一步训练里的优化器" }, { key: "sgd", title: "优化器：SGD" }, { key: "adamw", title: "优化器：AdamW 怎么算" }, { key: "batch", title: "优化器：本项目的 32 个回答、16 次累积、学习率" }], active = TABS[0].key;
  window.__setHash = function (key, k) {
    if (key !== active) return;
    try { history.replaceState(null, "", "#" + key + "-" + k); } catch (e) {}
  };
  function activate(key, step) {
    active = key;
    TABS.forEach(function (t) {
      document.getElementById(t.key + "-view").hidden = (t.key !== key);
      document.getElementById("tab-" + t.key).setAttribute("aria-selected", t.key === key ? "true" : "false");
      if (t.key === key) document.title = t.title;
    });
    var v = window.__v[key];
    v.show(step === undefined ? v.cur() : step - 1);
  }
  TABS.forEach(function (t) {
    document.getElementById("tab-" + t.key).addEventListener("click", function () { activate(t.key); window.scrollTo(0, 0); });
  });
  function fromHash() {
    var m = /^#([a-z]+)(?:-(\d+))?$/.exec(location.hash);
    if (m && window.__v[m[1]]) activate(m[1], m[2] ? parseInt(m[2], 10) : undefined);
    else activate(active);
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>

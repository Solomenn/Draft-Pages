<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习页</title>
<script>
  /* 旧链接 /#grpo 这类：跳到 explainers.html#grpo */
  (function () {
    var KEYS = ["popo", "rsi", "optimizer", "transformer", "rl", "ppo", "dpo", "grpo", "agentic-rl"];
    var k = location.hash.slice(1);
    if (KEYS.indexOf(k) >= 0) location.replace("explainers.html#" + k);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16202b; --muted: #5d6b7a; --line: #c9d1da; --accent: #0b6e8a;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151b; --panel: #161e26; --ink: #e6edf3; --muted: #93a1b0; --line: #2c3844; --accent: #4cc0df; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
  .grid { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h2 { margin: 0 0 14px; font-size: 18px; }
  .list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .list a { display: block; padding: 10px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 15px; }
  .list a:hover { background: var(--bg); color: var(--accent); }
  .big { display: flex; flex-direction: column; justify-content: center; text-decoration: none; color: var(--ink); min-height: 260px; transition: border-color .2s; }
  .big:hover { border-color: var(--accent); }
  .big .name { font-size: 24px; font-weight: 700; line-height: 1.35; }
  .big .part { margin-top: 10px; color: var(--muted); font-size: 15px; }
  .big .go { margin-top: 24px; color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="grid">
  <section class="card">
    <h2>讲解页</h2>
    <ul class="list">
      <li><a href="explainers.html#popo">POPO 项目</a></li>
      <li><a href="explainers.html#rsi">RSI 项目</a></li>
      <li><a href="explainers.html#optimizer">优化器原理</a></li>
      <li><a href="explainers.html#transformer">Transformer 与编码器解码器</a></li>
      <li><a href="explainers.html#rl">强化学习全貌</a></li>
      <li><a href="explainers.html#ppo">PPO 原理</a></li>
      <li><a href="explainers.html#dpo">DPO 原理</a></li>
      <li><a href="explainers.html#grpo">GRPO 原理</a></li>
      <li><a href="explainers.html#agentic-rl">Agentic RL 原理</a></li>
    </ul>
  </section>
  <a class="card big" href="napkin/index.html">
    <span class="name">An Infinitely Large Napkin</span>
    <span class="part">第 I–XIV 部分</span>
    <svg class="go" width="28" height="28" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
  </a>
</main>
</body>
</html>
